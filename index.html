const categorias=[['Te-waza',16],['Koshi-waza',10],['Ashi-waza',21],['Ma-sutemi-waza',5],['Yoko-sutemi-waza',14],['Osae-komi-waza',11],['Shime-waza',14],['Kansetsu-waza',9]];
let perguntas=[],atual=0,acertos=0,respondida=false,modo='',historico=[],erros=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mostrarMenu(){const app=document.getElementById('app');app.innerHTML='<header><h1>🥋 Quiz de Judô</h1><p>100 técnicas • 8 categorias</p></header><div class="intro"><b>Escolha uma categoria</b><div class="small">Questões e alternativas mudam a cada tentativa.</div></div><div class="grid" id="menuGrid"></div>';const grid=document.getElementById('menuGrid');categorias.forEach(([n,q],i)=>{const b=document.createElement('button');b.className='btn cat';b.innerHTML=(i+1)+'. '+n+'<span>'+q+' técnicas</span>';b.onclick=()=>iniciar(n);grid.appendChild(b)});const all=document.createElement('button');all.className='btn all';all.innerHTML='🎯 TODAS AS TÉCNICAS<span>100 técnicas</span>';all.onclick=()=>iniciar('Todas');grid.appendChild(all)}
function iniciar(cat,lista=null){modo=cat;perguntas=shuffle(lista?lista:(cat==='Todas'?banco:banco.filter(x=>x.cat===cat)));atual=0;acertos=0;historico=[];erros=[];carregar()}
function alternativasPara(q){const mesmo=banco.filter(x=>x.id!==q.id&&x.cat===q.cat);const outros=banco.filter(x=>x.id!==q.id&&x.cat!==q.cat);let erradas=shuffle(mesmo).slice(0,4);if(erradas.length<4)erradas=erradas.concat(shuffle(outros).slice(0,4-erradas.length));return shuffle([q,...erradas])}
function carregar(){respondida=false;const q=perguntas[atual],alts=alternativasPara(q);document.getElementById('app').innerHTML=`<header><h1>🥋 ${modo==='Todas'?'Todas as Técnicas':modo}</h1><p>${perguntas.length} questões</p></header><div class="status"><span>Questão ${atual+1} de ${perguntas.length}</span><span id="pts">Acertos: ${acertos}</span></div><div class="track"><div class="bar" style="width:${(atual+1)/perguntas.length*100}%"></div></div><div class="card"><div class="photo"><img src="${q.imagem}" alt="Imagem da técnica"></div><div class="question">Qual é a técnica apresentada na imagem?</div></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><button class="btn primary" id="next" style="display:none" onclick="proxima()">Próxima questão →</button><button class="btn secondary" onclick="mostrarMenu()">Voltar ao menu</button>`;const box=document.getElementById('opts');alts.forEach((g,i)=>{const b=document.createElement('button');b.className='option';b.dataset.id=g.id;b.textContent=String.fromCharCode(65+i)+') '+g.nome;b.onclick=()=>responder(b,g,q);box.appendChild(b)})}
function responder(btn,resposta,correta){if(respondida)return;respondida=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.id===correta.id)b.classList.add('correct')});const ok=resposta.id===correta.id;if(ok)acertos++;else{btn.classList.add('wrong');erros.push(correta)}historico.push({correta,respondida:resposta,ok});const fb=document.getElementById('fb');fb.innerHTML=ok?'✅ Correto!<br>'+correta.nome:'❌ Incorreto.<br>Resposta correta: '+correta.nome;fb.style.background=ok?'#dcf5e4':'#fde1df';fb.style.display='block';document.getElementById('pts').textContent='Acertos: '+acertos;document.getElementById('next').style.display='block'}
function proxima(){atual++;atual<perguntas.length?carregar():finalizar()}
function classificacao(p){if(p>=90)return '🏆 Excelente';if(p>=80)return '🥇 Muito bom';if(p>=70)return '🥈 Bom';return '📚 Recomenda-se revisar as técnicas'}
function tabelaCategorias(){if(modo!=='Todas')return '';return '<h3>Desempenho por categoria</h3><table class="category-table"><tr><th>Categoria</th><th>Acertos</th><th>Total</th><th>%</th></tr>'+categorias.map(([cat])=>{const h=historico.filter(x=>x.correta.cat===cat),a=h.filter(x=>x.ok).length,p=h.length?Math.round(a/h.length*100):0;return `<tr><td>${cat}</td><td>${a}</td><td>${h.length}</td><td>${p}%</td></tr>`}).join('')+'</table>'}
function listaErros(){if(!erros.length)return '<div class="review"><h3>✅ Nenhuma técnica errada</h3></div>';return '<div class="review"><h3>❌ Técnicas para revisar</h3>'+historico.filter(x=>!x.ok).map((x,i)=>`<div class="review-item bad"><b>${i+1}. ${x.correta.nome}</b><br>Sua resposta: ${x.respondida.nome}<br><b>Resposta correta: ${x.correta.nome}</b></div>`).join('')+'</div>'}
function finalizar(){const total=historico.length,err=total-acertos,p=Math.round(acertos/total*100);document.getElementById('app').innerHTML=`<header><h1>🥋 Resultado</h1><p>${modo}</p></header><div class="result"><div class="score">${p}%</div><div class="rating">${classificacao(p)}</div><div class="metrics"><div class="metric"><strong>${total}</strong>Questões</div><div class="metric"><strong>✅ ${acertos}</strong>Acertos</div><div class="metric"><strong>❌ ${err}</strong>Erros</div></div>${tabelaCategorias()}${listaErros()}<button class="btn primary" onclick="iniciar(modo)">🔄 Refazer o quiz</button>${erros.length?'<button class="btn danger" onclick="revisarErros()">❌ Revisar somente os erros</button>':''}<button class="btn secondary" onclick="mostrarMenu()">🏠 Voltar ao menu</button></div>`}
function revisarErros(){const unicos=[...new Map(erros.map(x=>[x.id,x])).values()];iniciar('Revisão dos erros',unicos)}
mostrarMenu();
</script></body></html>
